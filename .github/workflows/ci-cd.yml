name: CI/CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    name: CI - build and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore Temperaturas.sln
      - run: dotnet build Temperaturas.sln --configuration Release --no-restore
      - run: dotnet test Temperaturas.sln --configuration Release --no-build --no-restore

  delivery:
    name: CD - prepare release
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build and verify Docker image
        run: |
          docker build -t temperaturas-api:ci .
          docker run -d --name temperaturas-api -p 8080:8080 temperaturas-api:ci
          for attempt in {1..10}; do
            if curl --fail --silent 'http://localhost:8080/converter?celsius=25' | grep -q '"fahrenheit":77'; then
              docker ps
              exit 0
            fi
            sleep 2
          done
          docker logs temperaturas-api
          exit 1
      - name: Publish application
        run: dotnet publish src/Temperaturas.Api/Temperaturas.Api.csproj --configuration Release -o publish
      - uses: actions/upload-artifact@v7
        with:
          name: temperaturas-api
          path: publish/
          if-no-files-found: error

  notify:
    name: Alert - Telegram notification
    needs: [ci, delivery]
    if: ${{ always() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - name: Send workflow result to Telegram
        if: ${{ env.TELEGRAM_BOT_TOKEN != '' && env.TELEGRAM_CHAT_ID != '' }}
        env:
          CI_RESULT: ${{ needs.ci.result }}
          DELIVERY_RESULT: ${{ needs.delivery.result }}
          HEAD_BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ "$CI_RESULT" = "success" ] && [ "$DELIVERY_RESULT" = "success" ]; then
            STATUS="sucesso"
          else
            STATUS="falha"
          fi

          MESSAGE="CI/CD concluído com ${STATUS} na PR #${PR_NUMBER} (${HEAD_BRANCH}) do repositório ${REPOSITORY}. Testes: ${CI_RESULT}. ${RUN_URL}"
          curl --fail --silent --show-error \
            --request POST \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=${MESSAGE}" \
            --data-urlencode "disable_web_page_preview=true" \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage"

      - name: Report missing Telegram configuration
        if: ${{ env.TELEGRAM_BOT_TOKEN == '' || env.TELEGRAM_CHAT_ID == '' }}
        run: echo "Telegram alert skipped because TELEGRAM_BOT_TOKEN or TELEGRAM_CHAT_ID is not configured."
